id: orpc-contract-no-runtime-imports
valid:
  - 'import { ItemSchema } from "@peated/server/schemas";'
  - 'import { parseCursor } from "@peated/server/lib/activityCursor";'
  - 'import type { Item } from "@peated/server/db/schema";'
  - 'import { type Item } from "@peated/server/db/schema";'
  - 'import { type Item, type Other as Renamed } from "../../../db/schema";'
  - 'import { contract } from "../../base";'
  - 'import type * as schema from "@peated/server/db/schema";'
  - 'export type { Item } from "@peated/server/db/schema";'
  - 'export { type Item } from "@peated/server/db/schema";'
  - 'type Item = import("@peated/server/db/schema").Item;'
  - 'let item: import("@peated/server/db/schema").Item;'
  - 'type Database = typeof import("@peated/server/db");'
  - 'const item = value as import("@peated/server/db/schema").Item;'
  - 'const item = value satisfies import("@peated/server/db/schema").Item;'
  - 'export { ItemSchema } from "@peated/server/schemas";'
invalid:
  - 'import { db } from "@peated/server/db";'
  - 'import { items } from "@peated/server/db/schema";'
  - 'import config from "@peated/server/config";'
  - 'import * as worker from "@peated/server/worker/client";'
  - 'import handler from "@peated/server/orpc/routes/items/list";'
  - 'import { db } from "../../../db";'
  - 'import handler from "../../routes/items/list";'
  - 'import "@peated/server/config";'
  - 'import {} from "@peated/server/config";'
  - 'import { type Item, items } from "@peated/server/db/schema";'
  - 'import config, { type Config } from "@peated/server/config";'
  - 'export { items } from "@peated/server/db/schema";'
  - 'export { type Item, items } from "@peated/server/db/schema";'
  - 'export * from "@peated/server/orpc/routes/items";'
  - 'export {} from "@peated/server/config";'
  - 'export * as schema from "@peated/server/db/schema";'
  - 'const worker = await import("@peated/server/worker/client");'
  - 'const worker = (await import("@peated/server/worker/client")) as Worker;'
