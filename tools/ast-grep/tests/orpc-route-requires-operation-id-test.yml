id: orpc-route-requires-operation-id
valid:
  - 'contract.route({ operationId: "listItems" })'
  - "contract.route({ operationId })"
  - "contract.route(options)"
  - |
    procedure.route({
      method: "GET",
      path: "/items",
      spec: (spec) => ({ ...spec, operationId: "listItems" }),
    })
invalid:
  - 'contract.route({ method: "GET", path: "/items" })'
  - 'procedure.use(middleware({ operationId: "unrelated" })).route({ path: "/items" })'
  - |
    procedure.route({
      method: "GET",
      path: "/items",
    })
