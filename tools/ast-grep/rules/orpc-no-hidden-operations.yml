id: orpc-no-hidden-operations
language: TypeScript
severity: error
message: Keep internal operations documented with x-peated-internal and an Internal badge.
note: Scalar hides operations annotated with x-internal or x-scalar-ignore. Staff middleware adds Peated's visible annotations automatically.
files:
  - apps/server/src/orpc/**/*.ts
  - apps/server/src/openapi/**/*.ts
  - apps/server/src/app.ts
ignores:
  - apps/server/src/**/*.test.ts
rule:
  kind: pair
  has:
    field: key
    regex: >-
      ^["']x-(internal|scalar-ignore)["']$
