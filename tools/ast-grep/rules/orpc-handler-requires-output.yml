id: orpc-handler-requires-output
language: TypeScript
severity: error
message: An oRPC handler without a shared contract must declare an output schema.
files:
  - apps/server/src/orpc/routes/**/*.ts
rule:
  all:
    - pattern: $PROCEDURE.handler($HANDLER)
    - not:
        has:
          pattern: $CHAIN.output($SCHEMA)
          stopBy: end
    - not:
        has:
          pattern: implement($CONTRACT)
          stopBy: end
