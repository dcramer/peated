id: web-no-server-runtime-imports
language: TypeScript
severity: error
message: The web app must not import the API's database, configuration, worker, or route modules.
note: >-
  These modules hold server-only code and secrets, and anything a web module
  imports can end up in the browser bundle. Use the oRPC client for data and
  @peated/server/schemas, constants, or types for shapes.
files:
  - apps/web/**/*.ts
  - apps/web/**/*.tsx
utils:
  server-runtime-module:
    regex: ^["']@peated/server/(db|config|worker|orpc/routes)(/|["'])
rule:
  any:
    - kind: import_statement
      has:
        field: source
        matches: server-runtime-module
    - kind: export_statement
      has:
        field: source
        matches: server-runtime-module
    - kind: call_expression
      all:
        - has:
            field: function
            kind: import
        - has:
            field: arguments
            has:
              kind: string
              matches: server-runtime-module
