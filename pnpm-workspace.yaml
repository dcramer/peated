packages:
  - 'packages/*'
  - 'apps/*'
  - '!**/test/**'

allowBuilds:
  '@ast-grep/cli': true
  '@fission-ai/openspec': false
  '@parcel/watcher': false
  '@sentry/cli': false
  '@swc/core': true
  bcrypt: true
  core-js: false
  esbuild: false
  msgpackr-extract: false
  sharp: false
  simple-git-hooks: false

catalog:
  '@orpc/client': 1.15.0
  '@orpc/contract': 1.15.0
  '@orpc/openapi': 1.15.0
  '@orpc/server': 1.15.0
  '@orpc/shared': 1.15.0
  '@orpc/tanstack-query': 1.15.0
  '@orpc/zod': 1.15.0
  dotenv: ^16.4.7
  dotenv-cli: ^7.4.4
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  jsx-email: ^3.2.1
  pg: ^8.20.0
  prettier: ^3.8.1
  "@sentry/core": 10.76.2
  "@sentry/hono": 10.76.2
  "@sentry/nextjs": 10.76.2
  "@sentry/node": 10.76.2
  "@logtape/hono": 2.2.3
  "@logtape/logtape": 2.2.3
  "@logtape/redaction": 2.2.3
  "@opentelemetry/api": 1.9.1
  "@tanstack/react-query": ^5.90.21
  "@tanstack/react-query-next-experimental": ^5.91.0
  # TODO: theres an issue upgrading right now to 11.0.1

  tsx: ^4.23.15
  typescript: ^5.9.3
  "@types/node": ^24.13.2
  "@types/pg": ^8.18.0
  vite: ^8.3.5
  vitest: "~4.1.12"
  "@playwright/test": "^1.60.0"
  zod: ^4.5.4

  react: ^19.2.7
  react-dom: ^19.2.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3

# Overrides for vulnerable packages whose parents are already on their latest
# release but still ask for an old version. Remove each one when its parent
# allows the fixed version.
overrides:
  # drizzle-kit 0.31.11 lists @esbuild-kit/esm-loader but never loads it. Its
  # esbuild 0.18 has the dev server advisory fixed in 0.25.
  '@esbuild-kit/core-utils>esbuild': ^0.25.12
  # github-actionlint 1.7.12 asks for adm-zip ^0.5.16. adm-zip 0.6.1 fixes
  # zip-bomb, symlink, and SUID advisories. Only the Windows download unzips.
  'github-actionlint>adm-zip': ^0.6.1
  # jsx-email 3.2.1 pins these exact versions. The newer releases fix Vite
  # dev server, PostCSS source map, and React Router advisories.
  'jsx-email>postcss': ^8.5.31
  'jsx-email>react-router-dom': ^7.18.4
  'jsx-email>vite': ^8.3.5
  # @google-cloud/storage 7 uses gaxios 6 and teeny-request 9, which ask for
  # uuid ^9. uuid 11.1.1 adds a missing buffer bounds check.
  'gaxios@6>uuid': ^11.1.1
  'teeny-request@9>uuid': ^11.1.1
  # @sentry/nextjs's bundler plugins accept any webpack 5 as a peer, and the
  # lockfile kept 5.93. Later releases fix DOM clobbering and buildHttp SSRF.
  webpack: ^5.104.1

packageExtensions:
  # @hookform/resolvers imports zod types without declaring zod, so pnpm's
  # hidden hoisting picks one of the workspace's zod 4 copies. When it picked
  # knip's newer zod, the web build failed to type check zodResolver.ts. As a
  # peer, it uses the web app's own zod.
  '@hookform/resolvers':
    peerDependencies:
      zod: '*'

minimumReleaseAgeExclude:
  - zod@4.5.4

patchedDependencies:
  # Sensitive data policy (docs/policies/sensitive-data.md): DrizzleQueryError
  # puts every SQL parameter value in its message and stack, which reach logs,
  # Sentry, and BullMQ failure reasons. The patch keeps the query text only.
  # Regenerate it with `pnpm patch` when drizzle-orm changes version.
  drizzle-orm@0.45.4: patches/drizzle-orm@0.45.4.patch
