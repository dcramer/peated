packages:
  - 'packages/*'
  - 'apps/*'
  - '!**/test/**'

allowBuilds:
  '@ast-grep/cli': true
  '@fission-ai/openspec': false
  '@sentry/cli': false
  '@swc/core': true
  bcrypt: true
  core-js: false
  esbuild: false
  msgpackr-extract: false
  sharp: false
  simple-git-hooks: false

catalog:
  '@orpc/client': 1.15.0
  '@orpc/contract': 1.15.0
  '@orpc/openapi': 1.15.0
  '@orpc/server': 1.15.0
  '@orpc/shared': 1.15.0
  '@orpc/tanstack-query': 1.15.0
  '@orpc/zod': 1.15.0
  dotenv: ^16.4.7
  dotenv-cli: ^7.4.4
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  jsx-email: ^1.10.11
  pg: ^8.20.0
  prettier: ^3.8.1
  "@sentry/core": 10.76.2
  "@sentry/hono": 10.76.2
  "@sentry/nextjs": 10.76.2
  "@sentry/node": 10.76.2
  "@logtape/hono": 2.2.3
  "@logtape/logtape": 2.2.3
  "@logtape/redaction": 2.2.3
  "@opentelemetry/api": 1.9.1
  "@tanstack/react-query": ^5.90.21
  "@tanstack/react-query-next-experimental": ^5.91.0
  # TODO: theres an issue upgrading right now to 11.0.1

  tsx: ^4.21.0
  typescript: ^5.9.3
  "@types/node": ^24.13.2
  "@types/pg": ^8.18.0
  vite: ^8.3.5
  vitest: "~4.1.12"
  "@playwright/test": "^1.60.0"
  zod: ^4.5.4

  react: ^19.2.7
  react-dom: ^19.2.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3

minimumReleaseAgeExclude:
  - zod@4.5.4

patchedDependencies:
  # Sensitive data policy (docs/policies/sensitive-data.md): DrizzleQueryError
  # puts every SQL parameter value in its message and stack, which reach logs,
  # Sentry, and BullMQ failure reasons. The patch keeps the query text only.
  # Regenerate it with `pnpm patch` when drizzle-orm changes version.
  drizzle-orm@0.45.4: patches/drizzle-orm@0.45.4.patch
