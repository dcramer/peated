name: CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    name: "changes / detect"
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      e2e: ${{ steps.filter.outputs.e2e }}
      infra: ${{ steps.filter.outputs.infra }}
      packages: ${{ steps.filter.outputs.packages }}
      package_tests: ${{ steps.filter.outputs.package_tests }}
      repo: ${{ steps.filter.outputs.repo }}
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ci:
              - ".github/workflows/**"
            e2e:
              - "apps/web/**"
              - "packages/design/**"
              - "packages/orpc/**"
            infra:
              - "terraform/.tflint.hcl"
              - "terraform/**"
            packages:
              - "packages/**"
            package_tests:
              - "packages/bottle-classifier/**"
              - "packages/catalog-verifier/**"
              - "packages/entity-classifier/**"
            repo:
              - ".oxlintrc.json"
              - "knip.jsonc"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "sgconfig.yml"
              - "tools/ast-grep/**"
              - "turbo.json"
            server:
              - "apps/server/**"
              - "apps/cli/**"
              - "Dockerfile"
              - "docker-compose.yml"
              - "packages/bottle-classifier/**"
              - "packages/catalog-verifier/**"
              - "packages/design/**"
              - "packages/email/**"
              - "packages/entity-classifier/**"
              - "packages/orpc/**"
              - "packages/tsconfig/**"
            web:
              - "apps/web/**"
              - "apps/server/**"
              - "packages/bottle-classifier/**"
              - "packages/design/**"
              - "packages/orpc/**"
              - "packages/tsconfig/**"

  tflint:
    name: "infra / terraform lint"
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('terraform/.tflint.hcl') }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        name: Setup Terraform
        with:
          terraform_version: 1.15.8
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        name: Setup TFLint
        with:
          tflint_version: v0.64.0
      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false -lockfile=readonly
      - name: Validate Terraform
        run: terraform -chdir=terraform validate
      - name: Init TFLint
        run: tflint --chdir=terraform --init
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run TFLint
        run: tflint --chdir=terraform -f compact

  quality:
    name: "quality / lint and typecheck"
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.repo == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Audit GitHub Actions security
        run: uvx zizmor==1.29.0 --min-severity medium .
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Run lint
        run: pnpm lint
      - name: Test ast-grep rules
        run: pnpm ast-grep:test
      - name: Check monorepo manifests
        run: pnpm sherif
      - name: Check dead files and dependency integrity
        run: pnpm knip
      - name: Run typecheck
        run: pnpm typecheck

  package-build:
    name: "build / packages"
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.repo == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages

  server-build:
    name: "build / server"
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.repo == 'true' || needs.changes.outputs.server == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build server
        run: pnpm build:server

  web-build:
    name: "build / web"
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.repo == 'true' || needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm build:web

  server-tests:
    name: "test / server (${{ matrix.shard }}/${{ matrix.total }})"
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.repo == 'true' || needs.changes.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Run docker images
        run: docker compose up -d
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run server tests
        run: pnpm --filter @peated/server test:ci -- --shard=${{ matrix.shard }}/${{ matrix.total }}

  package-tests:
    name: "test / packages"
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.package_tests == 'true' || needs.changes.outputs.repo == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run package tests
        run: pnpm -r --filter='./packages/*' run --if-present test

  cli-tests:
    name: "test / cli"
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.repo == 'true' || needs.changes.outputs.server == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run CLI tests
        run: pnpm test:cli

  web-unit-tests:
    name: "test / web unit"
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.repo == 'true' || needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run web unit tests
        run: pnpm --filter @peated/web test:ci

  test:
    name: "ci / required"
    runs-on: ubuntu-latest
    needs:
      - changes
      - tflint
      - quality
      - package-build
      - server-build
      - web-build
      - cli-tests
      - package-tests
      - server-tests
      - web-unit-tests
      - e2e
    if: always()
    steps:
      - name: Check test jobs
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            exit 1
          fi
          failed=0
          for result in \
            "${{ needs.tflint.result }}" \
            "${{ needs.quality.result }}" \
            "${{ needs['package-build'].result }}" \
            "${{ needs['server-build'].result }}" \
            "${{ needs['web-build'].result }}" \
            "${{ needs['cli-tests'].result }}" \
            "${{ needs['package-tests'].result }}" \
            "${{ needs['server-tests'].result }}" \
            "${{ needs['web-unit-tests'].result }}" \
            "${{ needs.e2e.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              failed=1
            fi
          done
          exit "$failed"
  e2e:
    name: "test / web e2e"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.repo == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup Playwright cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright system dependencies
        run: pnpm --dir apps/web exec playwright install-deps chromium
      - name: Install Playwright browser
        run: pnpm --dir apps/web exec playwright install chromium
      - name: Run e2e tests
        run: pnpm test:e2e
