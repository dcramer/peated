name: Web screenshot baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: screenshots / baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Capture all baseline screenshots
        env:
          VISUAL_SOURCE_SHA: ${{ github.sha }}
        run: >-
          pnpm visual:web -- --all
          --out-dir "$GITHUB_WORKSPACE/visual-output/baseline"
      # Every main commit can become a pull request base, so each gets an exact artifact.
      - name: Store baseline by source revision
        uses: dcramer/frameshift/baseline/upload@b0bd168f717b9d7e865dc3aff252950519a58e40 # main
        with:
          name: peated-web-screenshots-v1
          sha: ${{ github.sha }}
          path: visual-output/baseline
          retention-days: 30
