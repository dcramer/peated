name: Evals

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: "evals / gate"
    runs-on: ubuntu-latest
    outputs:
      evals_requested: ${{ steps.gate.outputs.evals_requested }}
      gateway_ready: ${{ steps.gate.outputs.gateway_ready }}
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          set -euo pipefail

          label_name="trigger-evals"
          action="$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")"

          evals_requested=false
          if [[ "$action" == "labeled" ]]; then
            if [[ "$(jq -r '.label.name // ""' "$GITHUB_EVENT_PATH")" == "$label_name" ]]; then
              evals_requested=true
            fi
          elif jq -e --arg label_name "$label_name" '.pull_request.labels[]?.name | select(. == $label_name)' "$GITHUB_EVENT_PATH" >/dev/null; then
            evals_requested=true
          fi

          if [[ -n "${AI_GATEWAY_API_KEY:-}" ]]; then
            gateway_ready=true
          else
            gateway_ready=false
          fi

          should_run=false
          if [[ "$evals_requested" == "true" && "$gateway_ready" == "true" ]]; then
            should_run=true
          fi

          {
            echo "evals_requested=$evals_requested"
            echo "gateway_ready=$gateway_ready"
            echo "should_run=$should_run"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Eval Gate"
            echo
            echo "- label: $label_name"
            echo "- evals_requested: $evals_requested"
            echo "- gateway_ready: $gateway_ready"
            echo "- will_run: $should_run"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$evals_requested" == "true" && "$gateway_ready" != "true" ]]; then
            echo "::error::The trigger-evals label requires AI_GATEWAY_API_KEY."
            exit 1
          fi

  evals:
    name: "evals / classifier"
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - name: Run classifier evals
        run: >-
          pnpm --filter @peated/bottle-classifier evals --
          --reporter=vitest-evals/reporter
          --reporter=json
          --outputFile.json=vitest-results.json

      - name: Upload classifier eval report
        if: ${{ always() && hashFiles('packages/bottle-classifier/vitest-results.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottle-classifier-eval-report
          path: packages/bottle-classifier/vitest-results.json
