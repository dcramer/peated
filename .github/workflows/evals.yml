name: Evals

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Classifier evals use an aggregate quality gate. Scraper evals require exact
# parser output from fixed website fixtures.
env:
  EVAL_MIN_PASS_RATE: "0.8"

jobs:
  gate:
    name: "evals / gate"
    runs-on: ubuntu-latest
    outputs:
      classifier_requested: ${{ steps.gate.outputs.classifier_requested }}
      classifier_should_run: ${{ steps.gate.outputs.classifier_should_run }}
      gateway_ready: ${{ steps.gate.outputs.gateway_ready }}
      scraper_requested: ${{ steps.gate.outputs.scraper_requested }}
      scraper_should_run: ${{ steps.gate.outputs.scraper_should_run }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            scraper_agent:
              - "apps/server/src/scraper/configured/**"

      - id: gate
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          INTERNAL_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          SCRAPER_AGENT_CHANGED: ${{ steps.changes.outputs.scraper_agent }}
        run: |
          set -euo pipefail

          classifier_label="trigger-evals"
          scraper_label="trigger-evals-scraper"

          classifier_requested=false
          if jq -e --arg label_name "$classifier_label" '.pull_request.labels[]?.name | select(. == $label_name)' "$GITHUB_EVENT_PATH" >/dev/null; then
            classifier_requested=true
          fi

          scraper_requested=false
          if jq -e --arg label_name "$scraper_label" '.pull_request.labels[]?.name | select(. == $label_name)' "$GITHUB_EVENT_PATH" >/dev/null; then
            scraper_requested=true
          fi
          if [[ "$SCRAPER_AGENT_CHANGED" == "true" && "$INTERNAL_PR" == "true" ]]; then
            scraper_requested=true
          fi

          if [[ -n "${AI_GATEWAY_API_KEY:-}" ]]; then
            gateway_ready=true
          else
            gateway_ready=false
          fi

          classifier_should_run=false
          if [[ "$classifier_requested" == "true" && "$gateway_ready" == "true" ]]; then
            classifier_should_run=true
          fi

          scraper_should_run=false
          if [[ "$scraper_requested" == "true" && "$gateway_ready" == "true" ]]; then
            scraper_should_run=true
          fi

          {
            echo "classifier_requested=$classifier_requested"
            echo "classifier_should_run=$classifier_should_run"
            echo "gateway_ready=$gateway_ready"
            echo "scraper_requested=$scraper_requested"
            echo "scraper_should_run=$scraper_should_run"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Eval Gate"
            echo
            echo "- classifier label: $classifier_label"
            echo "- classifier requested: $classifier_requested"
            echo "- classifier will run: $classifier_should_run"
            echo "- scraper label: $scraper_label"
            echo "- scraper code changed: $SCRAPER_AGENT_CHANGED"
            echo "- scraper requested: $scraper_requested"
            echo "- scraper will run: $scraper_should_run"
            echo "- gateway_ready: $gateway_ready"
            echo "- min_pass_rate: $EVAL_MIN_PASS_RATE"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$classifier_requested" == "true" || "$scraper_requested" == "true" ]] && [[ "$gateway_ready" != "true" ]]; then
            echo "::error::Requested model checks require AI_GATEWAY_API_KEY."
            exit 1
          fi

  evals:
    name: "evals / classifier"
    needs: gate
    if: needs.gate.outputs.classifier_should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      BOTTLE_CLASSIFIER_EVAL_FIXED_EVIDENCE_FILE: evals/evidence/ci.json
      FIRECRAWL_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - name: Validate reviewed classifier evidence
        run: >-
          pnpm --filter @peated/bottle-classifier test
          src/evalFixtures.validate.test.ts
      - name: Run classifier evals
        id: run
        continue-on-error: true
        run: >-
          pnpm --filter @peated/bottle-classifier evals --
          --reporter=vitest-evals/reporter
          --reporter=json
          --outputFile.json=vitest-results.json

      - name: Require classifier eval results
        id: results
        if: steps.run.conclusion != 'skipped'
        run: >-
          test -f packages/bottle-classifier/vitest-results.json

      - name: Upload classifier eval report
        if: steps.results.conclusion == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottle-classifier-eval-report
          path: packages/bottle-classifier/vitest-results.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish classifier eval report
        id: report
        if: steps.results.conclusion == 'success'
        uses: getsentry/vitest-evals@abea6a519955e5df56ecb2a2d83bae9c821561e1 # v0.16.1
        with:
          results: packages/bottle-classifier/vitest-results.json
          min-pass-rate: ${{ env.EVAL_MIN_PASS_RATE }}

      # The pull request checks list shows a commit status's description, so
      # the pass rate is visible there without opening the run.
      - name: Show pass rate on the pull request
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVAL_STATUS: ${{ steps.report.outputs.status }}
          EVAL_TITLE: ${{ steps.report.outputs.gate-title }}
          EVALS_PASSED: ${{ steps.report.outputs.evals-passed }}
          EVALS_TOTAL: ${{ steps.report.outputs.evals-total }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          case "$EVAL_STATUS" in
            passed) state=success ;;
            failed) state=failure ;;
            *) state=error ;;
          esac

          if [[ "${EVALS_TOTAL:-0}" -gt 0 ]]; then
            pass_rate=$(awk -v passed="$EVALS_PASSED" -v total="$EVALS_TOTAL" 'BEGIN { printf "%.1f", 100 * passed / total }')
            floor=$(awk -v rate="$EVAL_MIN_PASS_RATE" 'BEGIN { printf "%g", 100 * rate }')
            description="${pass_rate}% passed (${EVALS_PASSED}/${EVALS_TOTAL}) · needs ${floor}%"
          else
            description="${EVAL_TITLE:-Classifier evals did not finish}"
          fi

          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="evals / classifier score" \
            -f description="${description:0:140}" \
            -f target_url="$RUN_URL" \
            >/dev/null
          echo "$description"

  scraper:
    name: "evals / scraper"
    needs: gate
    if: needs.gate.outputs.scraper_should_run == 'true'
    runs-on: ubuntu-latest
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: "pnpm"

      - run: docker compose up -d
      - run: pnpm install --frozen-lockfile
      - name: Run scraper evals
        run: pnpm evals:scraper
