name: Web screenshots

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/web/**"
      - "packages/design/**"
      - "packages/orpc/**"
      - ".github/workflows/web-visual.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: web-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: screenshots / capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve base revision
        if: github.event_name == 'pull_request'
        id: revision
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The merge commit is immutable for this run. Its first parent is the
          # exact base GitHub tested; pull_request.base.sha can be stale.
          BASE_SHA=$(git rev-parse "$MERGE_SHA^1")
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Run end-to-end tests and capture snapshots
        env:
          VISUAL_SOURCE_SHA: ${{ github.sha }}
          VISUAL_OUTPUT_DIR: ${{ github.workspace }}/visual-output/candidate
        run: pnpm test:e2e
      # Every main commit can become a pull request base, so each gets an exact artifact.
      - name: Store baseline by source revision
        if: github.event_name != 'pull_request'
        uses: dcramer/frameshift/baseline/upload@v0
        with:
          name: peated-web-screenshots-v1
          sha: ${{ github.sha }}
          path: visual-output/candidate
          retention-days: 30
      - name: Restore exact baseline artifact
        if: github.event_name == 'pull_request'
        uses: dcramer/frameshift/baseline@v0
        with:
          name: peated-web-screenshots-v1
          sha: ${{ steps.revision.outputs.base_sha }}
          path: ${{ github.workspace }}/visual-output/baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate baseline snapshots
        if: github.event_name == 'pull_request'
        run: >-
          node apps/web/visual/validate-baseline.mjs
          --baseline visual-output/baseline/manifest.json
          --candidate visual-output/candidate/manifest.json
          --sha "${{ steps.revision.outputs.base_sha }}"
      - name: Compare screenshots
        if: github.event_name == 'pull_request'
        uses: dcramer/frameshift@v0
        with:
          baseline: ${{ github.workspace }}/visual-output/baseline
          candidate: ${{ github.workspace }}/visual-output/candidate
          output: ${{ github.workspace }}/visual-output/report
      - name: Check screenshot report
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test -f visual-output/baseline/manifest.json
          test -f visual-output/candidate/manifest.json
          test -f visual-output/report/report.json
      - name: Upload screenshot report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frameshift-report
          path: visual-output/report
          if-no-files-found: error
          retention-days: 7

  frameshift:
    name: screenshots / report
    needs: capture
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # This job never checks out or runs pull request code.
      - uses: dcramer/frameshift/publish/workflow@v0
        with:
          retention-days: 30
