name: Web screenshots

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "apps/web/**"
      - "packages/design/**"
      - "packages/orpc/**"
      - ".github/workflows/web-visual.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: web-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: screenshots / capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Choose pages
        if: github.event_name == 'pull_request'
        id: mode
        env:
          MERGE_SHA: ${{ github.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          # The merge commit is immutable for this run. Its first parent is the
          # exact base GitHub tested; pull_request.base.sha can be stale.
          BASE_SHA=$(git rev-parse "$MERGE_SHA^1")
          if [[ ",$PR_LABELS," == *",run-all-screenshots,"* ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          git diff --name-only "$BASE_SHA" "$MERGE_SHA" > /tmp/peated-screenshot-changes.txt
          cat /tmp/peated-screenshot-changes.txt

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Capture all baseline screenshots
        if: github.event_name != 'pull_request'
        env:
          VISUAL_SOURCE_SHA: ${{ github.sha }}
        run: >-
          pnpm visual:web -- --all
          --out-dir "$GITHUB_WORKSPACE/visual-output/baseline-artifact"
      # Every main commit can become a pull request base, so each gets an exact artifact.
      - name: Store baseline by source revision
        if: github.event_name != 'pull_request'
        uses: dcramer/frameshift/baseline/upload@e964f36af42dfb2594f308ebbf1a9ea51e666c17
        with:
          name: peated-web-screenshots-v1
          sha: ${{ github.sha }}
          path: visual-output/baseline-artifact
          retention-days: 30
      - name: Capture candidate screenshots
        if: github.event_name == 'pull_request'
        env:
          ALL: ${{ steps.mode.outputs.all }}
          VISUAL_SOURCE_SHA: ${{ github.sha }}
          VISUAL_ROOT: ${{ github.workspace }}/visual-output
        run: |
          set -euo pipefail
          args=(
            --changed-file /tmp/peated-screenshot-changes.txt
            --out-dir "$VISUAL_ROOT/candidate"
          )
          if [[ "$ALL" == "true" ]]; then
            args+=(--all)
          fi
          pnpm visual:web -- "${args[@]}"
      - name: Restore exact baseline artifact
        if: github.event_name == 'pull_request'
        uses: dcramer/frameshift/baseline@e964f36af42dfb2594f308ebbf1a9ea51e666c17
        with:
          name: peated-web-screenshots-v1
          sha: ${{ steps.mode.outputs.base_sha }}
          path: ${{ github.workspace }}/visual-output/baseline-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Select matching baseline screenshots
        if: github.event_name == 'pull_request'
        run: >-
          node apps/web/visual/select-baseline.mjs
          --source visual-output/baseline-artifact
          --candidate visual-output/candidate/manifest.json
          --output visual-output/baseline
          --sha "${{ steps.mode.outputs.base_sha }}"
      - name: Compare screenshots
        if: github.event_name == 'pull_request'
        uses: dcramer/frameshift@e964f36af42dfb2594f308ebbf1a9ea51e666c17
        with:
          baseline: ${{ github.workspace }}/visual-output/baseline
          candidate: ${{ github.workspace }}/visual-output/candidate
          output: ${{ github.workspace }}/visual-output/report
      - name: Check screenshot report
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test -f visual-output/baseline/manifest.json
          test -f visual-output/candidate/manifest.json
          test -f visual-output/report/report.json
      - name: Upload screenshot report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frameshift-report
          path: visual-output/report
          if-no-files-found: error
          retention-days: 7

  frameshift:
    name: screenshots / report
    needs: capture
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # This job never checks out or runs pull request code.
      - uses: dcramer/frameshift/publish/workflow@e964f36af42dfb2594f308ebbf1a9ea51e666c17
        with:
          retention-days: 30
