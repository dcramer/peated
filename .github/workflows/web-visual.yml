name: Web screenshots

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/web/**"
      - "packages/design/**"
      - "packages/orpc/**"
      - ".github/workflows/web-visual.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: web-screenshots-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # E2E shards and Storybook capture run in parallel. The capture job merges
  # their images into one set for Frameshift.
  e2e:
    name: "screenshots / e2e (${{ matrix.shard }}/${{ matrix.total }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    strategy:
      matrix:
        shard: [1, 2]
        total: [2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Run end-to-end tests and capture snapshots
        env:
          VISUAL_OUTPUT_DIR: ${{ github.workspace }}/visual-output/candidate
        run: pnpm --dir apps/web test:e2e --shard=${{ matrix.shard }}/${{ matrix.total }}
      - name: Save screenshots for the capture job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-e2e-${{ matrix.shard }}
          path: visual-output/candidate
          # A shard may hold no tests that take snapshots.
          if-no-files-found: ignore
          retention-days: 1

  storybook:
    name: screenshots / storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Build Storybook for screenshots
        run: pnpm storybook:screenshots:build
      - name: Capture Storybook stories
        env:
          VISUAL_OUTPUT_DIR: ${{ github.workspace }}/visual-output/candidate
        run: pnpm storybook:screenshots
      - name: Save screenshots for the capture job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-storybook
          path: visual-output/candidate
          if-no-files-found: error
          retention-days: 1

  capture:
    name: screenshots / capture
    needs: [e2e, storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      frameshift-mode: ${{ steps.frameshift.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve base revision
        if: github.event_name == 'pull_request'
        id: revision
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The merge commit is immutable for this run. Its first parent is the
          # exact base GitHub tested; pull_request.base.sha can be stale.
          BASE_SHA=$(git rev-parse "$MERGE_SHA^1")
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Collect screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: visual-*
          merge-multiple: true
          path: visual-output/candidate
      # The merge commit's first parent is the base GitHub tested. Without a
      # saved set for that commit, there is nothing to compare against.
      - name: Find Frameshift baseline
        if: github.event_name == 'pull_request'
        id: frameshift-baseline
        env:
          BASE_SHA: ${{ steps.revision.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="peated-web-screenshots-v1-${BASE_SHA}"
          found="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact}" --jq '.artifacts | any(.expired == false)')"
          echo "found=${found}" >> "$GITHUB_OUTPUT"
          if [[ "$found" != "true" ]]; then
            echo "No baseline exists for ${BASE_SHA}. The next main run will create it."
          fi
      - name: Record screenshots
        if: >-
          github.event_name != 'pull_request' ||
          steps.frameshift-baseline.outputs.found == 'true'
        id: frameshift
        uses: dcramer/frameshift/ci@57ef8e4fa0147a7da4601d5e42bf5628e408fe82 # v0.2.0
        with:
          screenshots: visual-output/candidate
          saved-name: peated-web-screenshots-v1

  frameshift:
    name: screenshots / report
    needs: capture
    if: >-
      needs.capture.outputs.frameshift-mode == 'report' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # This job never checks out or runs pull request code.
      - uses: dcramer/frameshift/publish/workflow@57ef8e4fa0147a7da4601d5e42bf5628e408fe82 # v0.2.0
