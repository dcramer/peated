name: Web screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "apps/web/**"
      - "packages/design/**"
      - "packages/orpc/**"
      - ".github/workflows/web-visual-baseline.yml"
      - ".github/workflows/web-visual.yml"
      - ".github/workflows/web-visual-comment.yml"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: web-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    name: screenshots / capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Choose pages
        id: mode
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if [[ ",$PR_LABELS," == *",run-all-screenshots,"* ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          git diff --name-only "$BASE_SHA" "$MERGE_SHA" > /tmp/peated-screenshot-changes.txt
          cat /tmp/peated-screenshot-changes.txt

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Install candidate dependencies
        run: pnpm install --frozen-lockfile
      - name: Install candidate Playwright
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Capture candidate screenshots
        env:
          ALL: ${{ steps.mode.outputs.all }}
          VISUAL_SOURCE_SHA: ${{ github.sha }}
          VISUAL_ROOT: ${{ github.workspace }}/visual-output
        run: |
          set -euo pipefail
          args=(
            --changed-file /tmp/peated-screenshot-changes.txt
            --out-dir "$VISUAL_ROOT/candidate"
          )
          if [[ "$ALL" == "true" ]]; then
            args+=(--all)
          fi
          pnpm visual:web -- "${args[@]}"
      - name: Restore exact baseline artifact
        uses: dcramer/frameshift/baseline@b0bd168f717b9d7e865dc3aff252950519a58e40 # main
        with:
          name: peated-web-screenshots-v1
          sha: ${{ steps.mode.outputs.base_sha }}
          path: ${{ github.workspace }}/visual-output/baseline-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Select matching baseline screenshots
        run: >-
          node apps/web/visual/select-baseline.mjs
          --source visual-output/baseline-artifact
          --candidate visual-output/candidate/manifest.json
          --output visual-output/baseline
          --sha "${{ steps.mode.outputs.base_sha }}"
      - name: Compare screenshots
        uses: dcramer/frameshift@b0bd168f717b9d7e865dc3aff252950519a58e40 # main
        with:
          baseline: ${{ github.workspace }}/visual-output/baseline
          candidate: ${{ github.workspace }}/visual-output/candidate
          output: ${{ github.workspace }}/visual-output/report
      - name: Check screenshot report
        run: |
          set -euo pipefail
          test -f visual-output/baseline/manifest.json
          test -f visual-output/candidate/manifest.json
          test -f visual-output/report/report.json
      - name: Upload screenshot report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-screenshots
          path: |
            visual-output/baseline/manifest.json
            visual-output/candidate/manifest.json
            visual-output/report/report.json
            visual-output/report/images/**/*.png
          if-no-files-found: error
          retention-days: 14
